name: Ruina

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  ruina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py -u "${{ secrets.Username }}" -p "${{ secrets.Password }}"
